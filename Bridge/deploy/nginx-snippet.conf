# Baileys WhatsApp bridge - nginx location blocks
#
# Kept in sync with what's actually deployed in the shared
# /etc/nginx/sites-enabled/openhab config on the Pi (one server block shared
# across all projects on that box - see PI-INFRA notes). This file is for
# reference/history only; it is NOT included by nginx directly.
#
# Deployed 2026-08-29. Inserted just before the openHAB catch-all `location /`.

## Baileys WhatsApp bridge (added 2026-08-29)
location = /whatsapp-bridge {
    return 301 /whatsapp-bridge/;
}

## REST endpoints already require their own x-api-key (see Bridge/README.md)
## -- exempt from basic auth so external callers only need the API key, not
## also HTTP Basic credentials. More specific than /whatsapp-bridge/ below,
## so nginx matches these first (same pattern as /omni-post/content/video/
## in the shared config).
location /whatsapp-bridge/messages {
    proxy_pass                              http://127.0.0.1:7070/messages;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;
}
location /whatsapp-bridge/chats {
    proxy_pass                              http://127.0.0.1:7070/chats;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;
}
location /whatsapp-bridge/groups {
    proxy_pass                              http://127.0.0.1:7070/groups;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;
}
location /whatsapp-bridge/status {
    proxy_pass                              http://127.0.0.1:7070/status;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;
}
location /whatsapp-bridge/qr {
    proxy_pass                              http://127.0.0.1:7070/qr;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;
}

## Everything else (settings, dashboard, dashboard-example, /api/*, /assets/*)
## has no app-level auth of its own -- basic auth is the only gate. Uses the
## shared /etc/nginx/.htpasswd (same login as openHAB/omni-post), not a
## dedicated one.
location /whatsapp-bridge/ {
    proxy_pass                              http://127.0.0.1:7070/;
    proxy_set_header Host                   $http_host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto      $scheme;

    auth_basic                              "Username and Password Required";
    auth_basic_user_file                    /etc/nginx/.htpasswd;
}
