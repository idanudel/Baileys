<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Bridge activity</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
		nav a { margin-right: 1rem; }
		table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
		th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
		.ok { color: #0a7a2f; }
		.err { color: #b3261e; }
		.deliveries { font-size: 0.85em; color: #555; margin: 0; padding-left: 1rem; }
		.kind-inbound { background: #f0f7ff; }
		.kind-outbound { background: #fff8f0; }
	</style>
</head>
<body>
	<nav><a href="/settings">Settings</a><a href="/dashboard">Dashboard</a></nav>
	<h1>Activity</h1>
	<table>
		<thead>
			<tr><th>Time</th><th>Kind</th><th>From</th><th>To</th><th>Text</th><th>Status</th><th>Webhook deliveries</th></tr>
		</thead>
		<tbody id="rows"></tbody>
	</table>

	<script>
		const rowsEl = document.getElementById('rows')

		const fmtTime = ts => new Date(ts).toLocaleString()

		const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
			'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
		}[c]))

		const render = rows => {
			rowsEl.innerHTML = rows.map(row => {
				const from = row.kind === 'inbound' ? row.waFrom : (row.callerIp ? `REST (${esc(row.callerIp)})` : 'REST')
				const to = esc(row.waTo ?? '')
				const status = row.ok
					? '<span class="ok">ok</span>'
					: `<span class="err">error${row.error ? ': ' + esc(row.error) : ''}</span>`
				const deliveries = row.deliveries.length
					? '<ul class="deliveries">' + row.deliveries.map(d =>
						`<li>${esc(d.webhookUrl)} -> ${d.ok ? '<span class="ok">' + esc(d.statusCode ?? 'ok') + '</span>' : '<span class="err">' + esc(d.error ?? d.statusCode ?? 'error') + '</span>'} (${d.attempts} attempt${d.attempts === 1 ? '' : 's'})</li>`
					).join('') + '</ul>'
					: ''
				return `<tr class="kind-${esc(row.kind)}">
					<td>${esc(fmtTime(row.ts))}</td>
					<td>${esc(row.kind)}</td>
					<td>${esc(from)}</td>
					<td>${to}</td>
					<td>${esc(row.text ?? '')}</td>
					<td>${status}</td>
					<td>${deliveries}</td>
				</tr>`
			}).join('')
		}

		const refresh = async () => {
			const res = await fetch('/api/activity')
			render(await res.json())
		}

		refresh()
		setInterval(refresh, 5000)
	</script>
</body>
</html>
