<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Bridge activity</title>
	<link rel="stylesheet" href="/assets/theme.css" />
</head>
<body>
	<div class="topbar">
		<div class="brand">Baileys Bridge</div>
		<nav class="nav">
			<a href="/settings">Settings</a>
			<a href="/dashboard" class="active">Dashboard</a>
		</nav>
		<button class="theme-toggle" onclick="toggleBridgeTheme()">🌓 Theme</button>
	</div>

	<div class="page">
		<h1>Activity</h1>
		<div class="card example-banner" id="exampleBanner" style="display:none; margin-bottom:1.5rem;">
			Showing example data for preview — this isn't live activity. See the <a href="/dashboard">real dashboard</a>.
		</div>

		<div class="stats">
			<div class="stat">
				<div class="stat-icon total">💬</div>
				<div>
					<div class="stat-value" id="statTotal">0</div>
					<div class="stat-label">Total messages</div>
				</div>
			</div>
			<div class="stat">
				<div class="stat-icon sent">↑</div>
				<div>
					<div class="stat-value" id="statOutbound">0</div>
					<div class="stat-label">Sent via API</div>
				</div>
			</div>
			<div class="stat">
				<div class="stat-icon received">↓</div>
				<div>
					<div class="stat-value" id="statInbound">0</div>
					<div class="stat-label">Received from WhatsApp</div>
				</div>
			</div>
		</div>

		<div class="card">
			<table>
				<thead>
					<tr><th>Time</th><th>Kind</th><th>From</th><th>To</th><th>Text</th><th>Status</th><th>Webhook deliveries</th></tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</div>

	<script src="/assets/theme.js"></script>
	<script>
		const rowsEl = document.getElementById('rows')
		const AVATAR_COLORS = ['#6c5ce7', '#ff5c93', '#12946b', '#e08e0b', '#2f80ed', '#d64545']

		const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
			'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
		}[c]))

		const fmtTime = ts => new Date(ts).toLocaleString()

		const avatarColor = label => {
			let hash = 0
			for (const ch of label) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0
			return AVATAR_COLORS[hash % AVATAR_COLORS.length]
		}

		const avatar = label => {
			const safeLabel = label || '?'
			const initial = esc(safeLabel.replace(/[^0-9a-zA-Z]/g, '').slice(0, 1).toUpperCase() || '?')
			return `<span class="avatar" style="background:${avatarColor(safeLabel)}">${initial}</span>`
		}

		const render = rows => {
			document.getElementById('statTotal').textContent = rows.length
			document.getElementById('statOutbound').textContent = rows.filter(r => r.kind === 'outbound').length
			document.getElementById('statInbound').textContent = rows.filter(r => r.kind === 'inbound').length

			rowsEl.innerHTML = rows.map(row => {
				const fromLabel = row.kind === 'inbound' ? (row.waFrom ?? '?') : (row.callerIp ? `REST (${row.callerIp})` : 'REST')
				const to = esc(row.waTo ?? '')
				const kindBadge = `<span class="badge ${row.kind}">${row.kind}</span>`
				const status = row.ok
					? '<span class="pill-ok">ok</span>'
					: `<span class="pill-err">error${row.error ? ': ' + esc(row.error) : ''}</span>`
				const deliveries = row.deliveries.length
					? '<ul class="deliveries">' + row.deliveries.map(d =>
						`<li>${esc(d.webhookUrl)} -> ${d.ok ? '<span class="pill-ok">' + esc(d.statusCode ?? 'ok') + '</span>' : '<span class="pill-err">' + esc(d.error ?? d.statusCode ?? 'error') + '</span>'} (${d.attempts} attempt${d.attempts === 1 ? '' : 's'})</li>`
					).join('') + '</ul>'
					: ''
				return `<tr>
					<td>${esc(fmtTime(row.ts))}</td>
					<td>${kindBadge}</td>
					<td>${avatar(fromLabel)}${esc(fromLabel)}</td>
					<td>${to}</td>
					<td>${esc(row.text ?? '')}</td>
					<td>${status}</td>
					<td>${deliveries}</td>
				</tr>`
			}).join('')
		}

		const EXAMPLE_ROWS = [
			{
				id: 4, kind: 'inbound', ts: Date.now() - 2 * 60 * 1000,
				waFrom: '972501234567@s.whatsapp.net', waTo: '972509876543@s.whatsapp.net',
				text: 'Hey, is the order ready for pickup?', ok: true,
				deliveries: [
					{ webhookUrl: 'https://crm.example.com/hooks/whatsapp', ok: true, statusCode: 200, attempts: 1 },
					{ webhookUrl: 'https://backup.example.com/hooks/whatsapp', ok: false, attempts: 3, error: 'fetch failed' }
				]
			},
			{
				id: 3, kind: 'outbound', ts: Date.now() - 5 * 60 * 1000,
				waTo: '972501234567@s.whatsapp.net', callerIp: '192.168.0.42',
				text: 'Yes! Ready whenever you are 🎉', ok: true, deliveries: []
			},
			{
				id: 2, kind: 'inbound', ts: Date.now() - 40 * 60 * 1000,
				waFrom: '972502223344@s.whatsapp.net', waTo: '972509876543@s.whatsapp.net',
				text: 'Do you have this in size M?', ok: true,
				deliveries: [
					{ webhookUrl: 'https://crm.example.com/hooks/whatsapp', ok: true, statusCode: 200, attempts: 1 }
				]
			},
			{
				id: 1, kind: 'outbound', ts: Date.now() - 3 * 60 * 60 * 1000,
				waTo: '972505556677@s.whatsapp.net', callerIp: '192.168.0.55',
				text: 'Reminder: appointment tomorrow at 10am', ok: false, error: 'not connected', deliveries: []
			}
		]

		const isExample = location.pathname === '/dashboard-example'

		const refresh = async () => {
			const res = await fetch('/api/activity')
			render(await res.json())
		}

		if (isExample) {
			document.getElementById('exampleBanner').style.display = 'block'
			render(EXAMPLE_ROWS)
		} else {
			refresh()
			setInterval(refresh, 5000)
		}
	</script>
</body>
</html>
