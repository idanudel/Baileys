<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Bridge settings</title>
	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
	<div class="topbar">
		<div class="brand">Baileys Bridge</div>
		<nav class="nav">
			<a href="settings" class="active">Settings</a>
			<a href="dashboard">Dashboard</a>
		</nav>
		<button class="theme-toggle" onclick="toggleBridgeTheme()">🌓 Theme</button>
	</div>

	<div class="page">
		<h1>Configuration</h1>

		<div class="card">
			<label for="apiKey">API key (required by all clients calling /messages, /chats, /groups, /status, /qr)</label>
			<input id="apiKey" type="text" autocomplete="off" />

			<label for="webhookUrls">Webhook URLs (one per line, incoming messages are POSTed to each)</label>
			<textarea id="webhookUrls"></textarea>

			<button id="save" class="primary">Save</button>
			<div id="status"></div>
		</div>
	</div>

	<script src="assets/theme.js"></script>
	<script>
		const apiKeyEl = document.getElementById('apiKey')
		const webhookUrlsEl = document.getElementById('webhookUrls')
		const statusEl = document.getElementById('status')

		const load = async () => {
			const res = await fetch('api/config')
			const config = await res.json()
			apiKeyEl.value = config.apiKey
			webhookUrlsEl.value = config.webhookUrls.join('\n')
		}

		document.getElementById('save').addEventListener('click', async () => {
			statusEl.textContent = 'Saving...'
			const res = await fetch('api/config', {
				method: 'POST',
				headers: { 'content-type': 'application/json' },
				body: JSON.stringify({
					apiKey: apiKeyEl.value,
					webhookUrls: webhookUrlsEl.value.split('\n').map(s => s.trim()).filter(Boolean)
				})
			})
			statusEl.textContent = res.ok ? 'Saved.' : `Failed: ${(await res.json()).error}`
		})

		load()
	</script>
</body>
</html>
