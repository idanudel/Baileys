<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Bridge settings</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; font-family: monospace; margin-top: 0.25rem; }
		textarea { height: 6rem; }
		button { margin-top: 1.5rem; padding: 0.5rem 1.5rem; }
		#status { margin-top: 1rem; }
		nav a { margin-right: 1rem; }
	</style>
</head>
<body>
	<nav><a href="/settings">Settings</a><a href="/dashboard">Dashboard</a></nav>
	<h1>Bridge configuration</h1>

	<label for="apiKey">API key (required by all clients calling /messages, /chats, /groups, /status, /qr)</label>
	<input id="apiKey" type="text" autocomplete="off" />

	<label for="webhookUrls">Webhook URLs (one per line, incoming messages are POSTed to each)</label>
	<textarea id="webhookUrls"></textarea>

	<button id="save">Save</button>
	<div id="status"></div>

	<script>
		const apiKeyEl = document.getElementById('apiKey')
		const webhookUrlsEl = document.getElementById('webhookUrls')
		const statusEl = document.getElementById('status')

		const load = async () => {
			const res = await fetch('/api/config')
			const config = await res.json()
			apiKeyEl.value = config.apiKey
			webhookUrlsEl.value = config.webhookUrls.join('\n')
		}

		document.getElementById('save').addEventListener('click', async () => {
			statusEl.textContent = 'Saving...'
			const res = await fetch('/api/config', {
				method: 'POST',
				headers: { 'content-type': 'application/json' },
				body: JSON.stringify({
					apiKey: apiKeyEl.value,
					webhookUrls: webhookUrlsEl.value.split('\n').map(s => s.trim()).filter(Boolean)
				})
			})
			statusEl.textContent = res.ok ? 'Saved.' : `Failed: ${(await res.json()).error}`
		})

		load()
	</script>
</body>
</html>
